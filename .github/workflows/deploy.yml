name: Deploy QA or production
on:
  push:
    branches: [qa, main]
    # Evidence-only updates do not change the deployed application image.
    paths-ignore:
      - README.md
      - docs/**
permissions:
  contents: read
  packages: write
# Serialize server transfers and updates across both branches.
concurrency:
  group: is373-server-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run format:check
      - run: npx playwright install --with-deps chromium --only-shell
      - run: npm run test:e2e -- --workers=1
      - run: npm run build
      - name: Image names
        id: image
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          if [[ "$GITHUB_REF_NAME" == qa ]]; then
            service=qa
            tag=qa
          else
            service=production
            tag=prod
          fi
          echo "service=$service" >> "$GITHUB_OUTPUT"
          echo "immutable=ghcr.io/$repository:$tag-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "rolling=ghcr.io/$repository:$tag" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: production
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.immutable }}
            ${{ steps.image.outputs.rolling }}
      - name: Deploy only the selected service
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_SSH_KNOWN_HOSTS: ${{ secrets.SERVER_SSH_KNOWN_HOSTS }}
          DOMAIN: ${{ secrets.DOMAIN }}
          ACME_EMAIL: ${{ secrets.ACME_EMAIL }}
          SERVICE: ${{ steps.image.outputs.service }}
          IMAGE: ${{ steps.image.outputs.immutable }}
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${SERVER_HOST:?}" "${SERVER_USER:?}" "${SERVER_SSH_KEY:?}" "${SERVER_SSH_KNOWN_HOSTS:?}" "${DOMAIN:?}" "${ACME_EMAIL:?}"
          [[ $SERVER_HOST =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ $SERVER_USER =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ $DOMAIN =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ $ACME_EMAIL =~ ^[a-zA-Z0-9._+%-]+@[a-zA-Z0-9.-]+$ ]]
          install -m 700 -d ~/.ssh
          trap 'rm -f ~/.ssh/is373_key server-settings.txt' EXIT
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/is373_key
          printf '%s\n' "$SERVER_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/is373_key ~/.ssh/known_hosts
          printf '%s\n' "$DOMAIN" "$ACME_EMAIL" > server-settings.txt
          scp -i ~/.ssh/is373_key -o StrictHostKeyChecking=yes docker-compose.deploy.yml scripts/deploy-service.sh server-settings.txt "$SERVER_USER@$SERVER_HOST:/opt/is373/"
          ssh -i ~/.ssh/is373_key -o StrictHostKeyChecking=yes "$SERVER_USER@$SERVER_HOST" "bash /opt/is373/deploy-service.sh '$SERVICE' '$IMAGE'"

